name: Kernel qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      KERNELJSON_RELEASE_ID: ${{ github.sha }}
      DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Disposable local regression suite
        run: |
          test -z "$DOCKER_HOST"
          test "$(docker context show)" = default
          mkdir -p artifacts/local
          git rev-parse HEAD > artifacts/local/tested-commit.txt
          pnpm test --reporter=default --reporter=json --outputFile=artifacts/local/tests.json
          pnpm test:baseline
      - run: pnpm build
      - name: Reflection pure-contract mutation checks
        timeout-minutes: 5
        run: node scripts/mutation-check-reflection.mjs
      - name: Faculty authority mutation checks
        run: node scripts/mutation-check-faculties.mjs
      # KJ-P7A: every primary-identity authority rule must be proven by a test that FAILS when the rule
      # is broken. Per-mutation vitest logs and JSON reports are kept with the test evidence below.
      - name: Identity authority mutation checks
        timeout-minutes: 35
        env:
          MUTATION_LOG_DIR: artifacts/local/identity-mutations
        run: node scripts/mutation-check-identity.mjs
      - name: Production worker image startup
        run: |
          docker build -f infrastructure/docker/worker.Dockerfile -t kerneljson-worker:qualification .
          bash scripts/check-worker-image.sh kerneljson-worker:qualification
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ github.sha }}
          path: artifacts/local/
          retention-days: 14
      - name: Dispose test stack
        if: always()
        run: docker --context default compose -f infrastructure/docker/validation.compose.yaml down --volumes
  # KJ-P7B-1: every identity cognition binding rule (ADR-0022, D1 erratum) must be proven by a test that FAILS, or by the
  # migration's own pre-COMMIT qualification refusing, when the rule is broken. Apply failures never count as a kill.
  # A separate job so its runtime cannot starve the main qualification job's 60-minute budget.
  identity-cognition-mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: 'true'
      KERNELJSON_RELEASE_ID: ${{ github.sha }}
      DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Identity cognition mutation checks
        timeout-minutes: 110
        env:
          MUTATION_LOG_DIR: artifacts/local/identity-cognition-mutations
        run: |
          docker --context default compose -f infrastructure/docker/validation.compose.yaml up -d db
          node scripts/mutation-check-identity-cognition.mjs
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-cognition-mutations-${{ github.sha }}
          path: artifacts/local/identity-cognition-mutations/
          retention-days: 14
      - name: Dispose test stack
        if: always()
        run: docker --context default compose -f infrastructure/docker/validation.compose.yaml down --volumes
# No environment, deployment credentials, vault access, remote Docker endpoint,
# Supabase CLI, or production project is supplied to this job.
