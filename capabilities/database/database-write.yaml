id: database.write
implementation: supabase-mcp-server (execute_sql, apply_migration)
runtime: supabase-mcp
inputs:
  table:
    type: string
    description: Target database table
    required: true
  operation:
    type: string
    enum: [insert, update, delete, upsert, ddl]
    required: true
  records:
    type: array
    items: object
    required: false
  sql:
    type: string
    description: Raw SQL statement for DDL operations
    required: false
outputs:
  affected_rows:
    type: integer
  status:
    type: string
  transaction_id:
    type: string
side_effects:
  - write-db
  - schema-migration
permissions:
  - supabase-service-key
  - jonny-signoff (for production schema DDL)
evidence_produced:
  format: postgres_tx_id
  fields:
    - affected_rows
    - status
stateful: true
status: enabled
