# KernelJSON operator MCP server (ADR-0025) - production deploy artefact. PREPARED, NOT DEPLOYED.
# Runbook: docs/operations/OPERATOR_MCP.md. Deploying it is a production change with its own window.
#
# Image:     the admission door image of the SAME release (it already contains apps/mcp), run with a
#            different command. KJ_MCP_IMAGE must be set explicitly, e.g. kerneljson-admission-door:<sha>.
# Secrets:   from a mode-600 env file built from jVault (never argv, never committed):
#              KJ_ADMISSION_BEARER, GOOGLE_CLIENT_SECRET, MCP_TOKEN_SIGNING_KEY
# Public:    MCP_PUBLIC_URL, MCP_ALLOWED_GOOGLE_SUB, GOOGLE_CLIENT_ID, KERNELJSON_RELEASE_ID
# Networks:  kerneljson-exec (to reach the door by container name) and kj-mcp-edge (Caddy reaches the
#            server by container name). Both are pre-created EXTERNAL networks. No host port is
#            published: the only way in is Caddy on kj-mcp.jonnyai.co.uk.
# Start:     docker compose --env-file /opt/kerneljson/runtime/mcp/runtime.env -f mcp.compose.yaml up -d
name: kerneljson-mcp
services:
  mcp:
    image: ${KJ_MCP_IMAGE:?set KJ_MCP_IMAGE to the door image of the same release}
    container_name: kerneljson-mcp
    command: ["node", "--import", "tsx", "apps/mcp/src/main.ts"]
    environment:
      # OAuth is the only mode this file can run: local-unauthenticated refuses non-loopback binds.
      MCP_AUTH: oauth
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8090"
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?set MCP_PUBLIC_URL, e.g. https://kj-mcp.jonnyai.co.uk}
      MCP_ALLOWED_GOOGLE_SUB: ${MCP_ALLOWED_GOOGLE_SUB:?set the permitted Google subject id}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set the Google OAuth client id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set from jVault; never commit}
      MCP_TOKEN_SIGNING_KEY: ${MCP_TOKEN_SIGNING_KEY:?set from jVault; never commit}
      MCP_ALLOWED_REDIRECT_URIS: ${MCP_ALLOWED_REDIRECT_URIS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      # open for the first ChatGPT connection, then closed (runbook step 9).
      MCP_REGISTRATION: ${MCP_REGISTRATION:?set open or closed}
      KJ_ADMISSION_URL: http://kerneljson-admission-door-gateway-1:8081
      KJ_ADMISSION_BEARER: ${KJ_ADMISSION_BEARER:?set from jVault; never commit}
      KERNELJSON_RELEASE_ID: ${KERNELJSON_RELEASE_ID:?set to the door release}
      TSX_DISABLE_CACHE: "1"
    user: "node"
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks: [kerneljson-exec, kj-mcp-edge]
networks:
  kerneljson-exec:
    external: true
    name: kerneljson-exec
  kj-mcp-edge:
    external: true
    name: kj-mcp-edge
